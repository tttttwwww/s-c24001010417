<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萌宠用品小店 · 宠物用品销售网站</title>
<style>
  :root{
    --bg:#FAF5EF; --card:#ffffff; --ink:#2E2419; --muted:#8A7A68;
    --accent:#E07B39; --accent-deep:#C8632A;
    --food:#E07B39; --toy:#3E8E7E; --item:#9C5A3C;
    --line:#ECE0D2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.6}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select{font-family:inherit}

  /* ===== 顶部导航 ===== */
  nav{position:sticky;top:0;z-index:50;background:#fff;
      border-bottom:1px solid var(--line);display:flex;align-items:center;
      justify-content:space-between;padding:14px 32px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
  .brand svg{width:30px;height:30px}
  .nav-links{display:flex;gap:24px;font-size:15px;color:var(--muted)}
  .nav-links a{color:inherit;text-decoration:none;cursor:pointer}
  .nav-links a:hover{color:var(--accent)}
  .cart-btn{position:relative;background:var(--accent);color:#fff;border-radius:999px;
            padding:9px 18px;font-size:15px;display:flex;align-items:center;gap:8px}
  .cart-btn:hover{background:var(--accent-deep)}
  .cart-badge{position:absolute;top:-6px;right:-6px;background:#B33A2A;color:#fff;
              width:22px;height:22px;border-radius:50%;font-size:12px;
              display:flex;align-items:center;justify-content:center;font-weight:700}

  /* ===== Hero ===== */
  header{background:linear-gradient(135deg,#FFF3E4 0%,#FBD9B8 100%);
         padding:64px 32px;text-align:center}
  header h1{font-size:42px;letter-spacing:1px;margin-bottom:12px}
  header h1 em{font-style:normal;color:var(--accent)}
  header p{color:#6B5A47;font-size:17px;margin-bottom:24px}
  .cta{background:var(--accent);color:#fff;padding:12px 32px;border-radius:999px;
       font-size:16px;box-shadow:0 6px 18px rgba(224,123,57,.35)}
  .cta:hover{background:var(--accent-deep)}

  /* ===== 筛选区 ===== */
  .toolbar{max-width:1200px;margin:32px auto 8px;padding:0 24px;
           display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:11px 16px 11px 42px;border:1px solid var(--line);
                border-radius:999px;font-size:15px;background:#fff;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
              width:18px;height:18px;color:var(--muted)}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{padding:8px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);
        font-size:14px;color:var(--muted)}
  .pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .price-filter{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
  .price-filter input{width:90px;padding:8px 10px;border:1px solid var(--line);
                      border-radius:10px;font-size:14px;background:#fff}

  /* ===== 提示条 ===== */
  .banner{max-width:1200px;margin:16px auto 0;padding:0 24px;display:none}
  .banner.show{display:block}
  .banner div{background:#FBE3DE;color:#B33A2A;border:1px solid #F2C9C0;
              border-radius:12px;padding:12px 16px;font-size:15px}

  /* ===== 商品网格 ===== */
  .grid{max-width:1200px;margin:24px auto 60px;padding:0 24px;
        display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
  .card{background:var(--card);border-radius:18px;overflow:hidden;
        border:1px solid var(--line);display:flex;flex-direction:column;
        transition:transform .18s,box-shadow .18s}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(80,50,20,.10)}
  .thumb{height:150px;display:flex;align-items:center;justify-content:center}
  .thumb svg{width:74px;height:74px}
  .body{padding:16px;flex:1;display:flex;flex-direction:column;gap:6px}
  .tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;width:fit-content}
  .tag.food{background:#FCE7D6;color:var(--food)}
  .tag.toy{background:#DDF0EB;color:var(--toy)}
  .tag.item{background:#F3E2D6;color:var(--item)}
  .name{font-size:17px;font-weight:600}
  .stock{font-size:13px;color:var(--muted)}
  .stock.out{color:#B33A2A;font-weight:600}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
  .price{color:var(--accent);font-weight:700;font-size:20px}
  .price small{font-size:12px;font-weight:400}
  .add{background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-size:14px}
  .add:hover{background:var(--accent)}
  .add:disabled{background:#D8CEC2;cursor:not-allowed}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

  /* ===== 商品管理面板 ===== */
  .admin{max-width:1200px;margin:0 auto 60px;padding:0 24px;display:none}
  .admin.show{display:block}
  .admin h2{font-size:22px;margin:8px 0 6px}
  .admin .hint{color:var(--muted);font-size:14px;margin-bottom:16px}
  .form{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;
        border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
  .form input{flex:1;min-width:130px;padding:9px 12px;border:1px solid var(--line);
              border-radius:10px;font-size:15px;outline:none}
  .form input:focus{border-color:var(--accent)}
  .form button{background:var(--accent);color:#fff;border-radius:10px;padding:10px 20px;font-size:15px}
  .form button:hover{background:var(--accent-deep)}
  .form button.ghost{background:#F3ECE2;color:var(--ink)}
  .form button.ghost:hover{background:#E8DCCB}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
        border-radius:14px;overflow:hidden}
  th,td{padding:12px 14px;text-align:left;font-size:15px;border-bottom:1px solid var(--line)}
  th{background:#FBF6EF;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:none}
  td button{background:#F3ECE2;border-radius:8px;padding:6px 12px;font-size:13px;margin-right:6px}
  td button:hover{background:#E8DCCB}
  td button.danger{background:#FBE3DE;color:#B33A2A}
  td button.danger:hover{background:#F5D2CB}

  /* ===== 购物车抽屉 ===== */
  .mask{position:fixed;inset:0;background:rgba(40,25,10,.4);z-index:90;
        opacity:0;pointer-events:none;transition:opacity .25s}
  .mask.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:-400px;width:380px;max-width:90vw;height:100vh;
          background:#fff;z-index:100;transition:right .28s;display:flex;flex-direction:column;
          box-shadow:-8px 0 30px rgba(0,0,0,.15)}
  .drawer.show{right:0}
  .drawer h3{padding:20px;border-bottom:1px solid var(--line);font-size:18px}
  .cart-list{flex:1;overflow:auto;padding:16px 20px}
  .cart-item{display:flex;justify-content:space-between;align-items:center;
             padding:12px 0;border-bottom:1px dashed var(--line)}
  .cart-item .nm{font-size:15px}
  .cart-item .pr{color:var(--accent);font-weight:600;font-size:14px}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:26px;height:26px;border-radius:8px;background:#F3ECE2;font-size:15px}
  .foot{padding:18px 20px;border-top:1px solid var(--line)}
  .total{display:flex;justify-content:space-between;font-size:17px;margin-bottom:14px}
  .checkout{width:100%;background:var(--accent);color:#fff;padding:13px;
            border-radius:12px;font-size:16px}
  .checkout:hover{background:var(--accent-deep)}

  /* ===== Toast ===== */
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:#fff;padding:10px 22px;border-radius:999px;
         font-size:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none;
         max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:#B33A2A}

  footer{text-align:center;color:var(--muted);font-size:13px;padding:28px;
         border-top:1px solid var(--line)}

  @media (max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.grid{grid-template-columns:1fr} header h1{font-size:30px}
    .search input,.price-filter input{font-size:16px}}
</style>
</head>
<body>

<nav>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="#E07B39"><path d="M12 12c-2.5 0-4.5 2-4.5 4.2 0 1.9 1.4 3.3 3.2 3.3.9 0 1.4-.3 2.1-.3s1.2.3 2.1.3c1.8 0 3.2-1.4 3.2-3.3C16.5 14 14.5 12 12 12zM6.5 8a1.8 1.8 0 100 3.6 1.8 1.8 0 000-3.6zm11 0a1.8 1.8 0 100 3.6 1.8 1.8 0 000-3.6zM9 4.5a1.6 1.6 0 100 3.2 1.6 1.6 0 000-3.2zm6 0a1.6 1.6 0 100 3.2 1.6 1.6 0 000-3.2z"/></svg>
    萌宠用品小店
  </div>
  <div class="nav-links">
    <a onclick="showShop()">全部商品</a>
    <a onclick="toggleAdmin()">商品管理</a>
  </div>
  <button class="cart-btn" onclick="toggleCart(true)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.6 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg>
    购物车<span class="cart-badge" id="badge">0</span>
  </button>
</nav>

<header>
  <h1>给<em>毛孩子</em>更好的生活</h1>
  <p>精选宠物食品、玩具与日常用品，品质安心 · 价格亲民</p>
  <button class="cta" onclick="showShop()">立即逛逛</button>
</header>

<section class="toolbar" id="shop">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="kw" type="text" placeholder="搜索商品名称…" oninput="onSearchInput()">
  </div>
  <div class="pills" id="pills"></div>
  <div class="price-filter">
    价格
    <input id="minP" type="number" placeholder="最低" oninput="onSearchInput()">
    ~
    <input id="maxP" type="number" placeholder="最高" oninput="onSearchInput()">
  </div>
</section>

<div class="banner" id="banner"><div id="bannerText"></div></div>

<main class="grid" id="grid"></main>

<!-- ===== 商品管理面板：增删改都调用后端 REST 接口 ===== -->
<section class="admin" id="admin">
  <h2>商品管理</h2>
  <p class="hint">这里的操作会真实调用后端接口（<code>/api/products</code>），改完商品列表会立即刷新。</p>

  <div class="form">
    <input id="fName" type="text" placeholder="商品名称">
    <input id="fCategory" type="text" placeholder="分类（食品/玩具/用品）">
    <input id="fPrice" type="number" step="0.01" placeholder="价格">
    <input id="fStock" type="number" placeholder="库存">
    <button onclick="submitProduct()" id="submitBtn">新增商品</button>
    <button class="ghost" onclick="resetForm()">清空</button>
  </div>

  <table>
    <thead>
      <tr><th>ID</th><th>名称</th><th>分类</th><th>价格</th><th>库存</th><th>操作</th></tr>
    </thead>
    <tbody id="adminBody"></tbody>
  </table>
</section>

<div class="mask" id="mask" onclick="toggleCart(false)"></div>
<aside class="drawer" id="drawer">
  <h3>我的购物车</h3>
  <div class="cart-list" id="cartList"></div>
  <div class="foot">
    <div class="total"><span>合计</span><span id="total">¥0.00</span></div>
    <button class="checkout" onclick="checkout()">去结算</button>
  </div>
</aside>

<div class="toast" id="toast">已加入购物车</div>

<footer>© 萌宠用品小店 · 宠物用品销售网站（课程项目演示）</footer>

<script>
/* ============================================================================
   本页数据全部来自后端 REST 接口，页面里不再写死任何商品数据。

   接口约定（后端由 com.neusoft.petshop.api 提供）：
     GET    /api/products?keyword=&category=&minPrice=&maxPrice=   商品列表 / 组合筛选
     GET    /api/products/categories                               全部分类
     GET    /api/products/{id}                                     商品详情
     POST   /api/products                                          新增商品
     PUT    /api/products/{id}                                     修改商品
     DELETE /api/products/{id}                                     删除商品
     POST   /api/orders                                            下单结算
     GET    /api/orders                                            订单列表

   统一响应结构： { code, message, data }，code === 200 才算成功。
   ============================================================================ */

// 页面由 Spring Boot 提供时用相对路径（同源，不跨域）；
// 如果是直接双击 index.html 打开（file://），就得写后端完整地址。
const API = (location.protocol === "file:") ? "http://localhost:8080/api" : "/api";

const CAT_COLOR = {食品:"var(--food)", 玩具:"var(--toy)", 用品:"var(--item)"};
const CAT_CLASS = {食品:"food", 玩具:"toy", 用品:"item"};

let curCat = "全部";
let cart = JSON.parse(localStorage.getItem("petshop_cart") || "{}");
let productCache = {};   // id -> 商品，购物车渲染和下单校验都要用
let editingId = null;    // 管理面板：正在编辑的商品 id，null 表示「新增」
let searchTimer = null;

/* ---------------- 通用请求封装 ---------------- */

async function api(path, options) {
  let res;
  try {
    res = await fetch(API + path, options);
  } catch (e) {
    // fetch 直接 reject：后端没启动，或者被跨域拦了
    throw new Error("无法连接后端（" + API + "），请确认 Spring Boot 已启动");
  }
  let body;
  try {
    body = await res.json();
  } catch (e) {
    throw new Error("后端返回的不是合法 JSON（HTTP " + res.status + "）");
  }
  if (body.code !== 200) {
    throw new Error(body.message || ("请求失败（code=" + body.code + "）"));
  }
  return body.data;
}

/* ---------------- 分类筛选按钮（由后端返回，不写死） ---------------- */

async function loadCategories() {
  try {
    const cats = await api("/products/categories");
    const box = document.getElementById("pills");
    box.innerHTML = ["全部", ...cats].map(c =>
      `<button class="pill ${c === curCat ? "active" : ""}" data-cat="${c}" onclick="setCat(this)">${c}</button>`
    ).join("");
  } catch (e) {
    showBanner(e.message);
  }
}

function setCat(btn) {
  document.querySelectorAll(".pill").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  curCat = btn.dataset.cat;
  loadProducts();
}

/* ---------------- 商品列表 ---------------- */

// 搜索框每敲一个字都请求一次太浪费，等用户停 300ms 再发请求（这叫防抖 debounce）
function onSearchInput() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadProducts, 300);
}

async function loadProducts() {
  const params = new URLSearchParams();
  const kw = document.getElementById("kw").value.trim();
  const min = document.getElementById("minP").value;
  const max = document.getElementById("maxP").value;
  if (kw) params.set("keyword", kw);
  if (curCat && curCat !== "全部") params.set("category", curCat);
  if (min !== "") params.set("minPrice", min);
  if (max !== "") params.set("maxPrice", max);

  try {
    const list = await api("/products" + (params.toString() ? "?" + params : ""));
    productCache = {};
    list.forEach(p => productCache[p.id] = p);
    renderGrid(list);
    if (document.getElementById("admin").classList.contains("show")) renderAdmin(list);
    showBanner("");
  } catch (e) {
    document.getElementById("grid").innerHTML =
      `<div class="empty">商品加载失败：${e.message}</div>`;
  }
}

function thumb(cat) {
  const c = CAT_COLOR[cat] || "var(--item)";
  if (cat === "食品") return `<svg viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="2.5"><path d="M10 30h44c0 12-9 22-22 22S10 42 10 30z"/><path d="M20 30c0-8 5-14 12-14M32 16c3 2 5 5 5 9" stroke-linecap="round"/><circle cx="24" cy="38" r="2" fill="${c}"/><circle cx="34" cy="41" r="2" fill="${c}"/><circle cx="43" cy="37" r="2" fill="${c}"/></svg>`;
  if (cat === "玩具") return `<svg viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="2.5"><circle cx="32" cy="34" r="18"/><circle cx="32" cy="34" r="8"/><path d="M32 16V8M20 22l-6-6M44 22l6-6" stroke-linecap="round"/></svg>`;
  return `<svg viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="2.5"><path d="M8 40c0-8 6-14 14-14h20c8 0 14 6 14 14v6H8z"/><path d="M14 46v6M50 46v6" stroke-linecap="round"/></svg>`;
}

function renderGrid(list) {
  const grid = document.getElementById("grid");
  if (!list.length) {
    grid.innerHTML = `<div class="empty">没有找到符合条件的商品，换个条件试试～</div>`;
    return;
  }
  grid.innerHTML = list.map(p => `
    <div class="card">
      <div class="thumb" style="background:${(CAT_COLOR[p.category] || "var(--item)")}1A">${thumb(p.category)}</div>
      <div class="body">
        <span class="tag ${CAT_CLASS[p.category] || "item"}">${p.category}</span>
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="stock ${p.stock <= 0 ? "out" : ""}">${p.stock <= 0 ? "暂时缺货" : "库存 " + p.stock + " 件"}</div>
        <div class="row">
          <div class="price"><small>¥</small>${Number(p.price).toFixed(2)}</div>
          <button class="add" onclick="addToCart(${p.id})" ${p.stock <= 0 ? "disabled" : ""}>
            ${p.stock <= 0 ? "已售罄" : "加入购物车"}
          </button>
        </div>
      </div>
    </div>`).join("");
}

/* ---------------- 商品管理（增 / 改 / 删） ---------------- */

function toggleAdmin() {
  const box = document.getElementById("admin");
  box.classList.toggle("show");
  if (box.classList.contains("show")) {
    box.scrollIntoView({behavior:"smooth", block:"start"});
    loadProducts();
  }
}

function showShop() {
  document.getElementById("admin").classList.remove("show");
  document.getElementById("shop").scrollIntoView({behavior:"smooth"});
}

function renderAdmin(list) {
  const body = document.getElementById("adminBody");
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="6" style="color:#8A7A68">没有商品</td></tr>`;
    return;
  }
  body.innerHTML = list.map(p => `
    <tr>
      <td>${p.id}</td>
      <td>${escapeHtml(p.name)}</td>
      <td>${escapeHtml(p.category)}</td>
      <td>¥${Number(p.price).toFixed(2)}</td>
      <td>${p.stock}</td>
      <td>
        <button onclick="editProduct(${p.id})">编辑</button>
        <button class="danger" onclick="deleteProduct(${p.id})">删除</button>
      </td>
    </tr>`).join("");
}

function editProduct(id) {
  const p = productCache[id];
  if (!p) return;
  editingId = id;
  document.getElementById("fName").value = p.name;
  document.getElementById("fCategory").value = p.category;
  document.getElementById("fPrice").value = p.price;
  document.getElementById("fStock").value = p.stock;
  document.getElementById("submitBtn").textContent = "保存修改（id=" + id + "）";
  document.getElementById("fName").focus();
}

function resetForm() {
  editingId = null;
  ["fName","fCategory","fPrice","fStock"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("submitBtn").textContent = "新增商品";
}

async function submitProduct() {
  const payload = {
    name: document.getElementById("fName").value.trim(),
    category: document.getElementById("fCategory").value.trim(),
    price: document.getElementById("fPrice").value,
    stock: document.getElementById("fStock").value
  };
  if (!payload.name || !payload.category || payload.price === "" || payload.stock === "") {
    showToast("四项都要填完整", true);
    return;
  }
  try {
    if (editingId === null) {
      await api("/products", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      showToast("新增成功");
    } else {
      await api("/products/" + editingId, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      showToast("修改成功");
    }
    resetForm();
    await loadCategories();   // 分类可能有新增，刷新筛选按钮
    await loadProducts();
  } catch (e) {
    showToast(e.message, true);
  }
}

async function deleteProduct(id) {
  const p = productCache[id];
  if (!confirm("确定删除「" + (p ? p.name : id) + "」吗？")) return;
  try {
    await api("/products/" + id, {method: "DELETE"});
    showToast("删除成功");
    await loadProducts();
    await loadCategories();
  } catch (e) {
    showToast(e.message, true);
  }
}

/* ---------------- 购物车（仍存在浏览器本地） ---------------- */

function addToCart(id) {
  const p = productCache[id];
  if (!p) return;
  const inCart = cart[id] || 0;
  if (inCart + 1 > p.stock) {
    showToast("库存只剩 " + p.stock + " 件了", true);
    return;
  }
  cart[id] = inCart + 1;
  saveCart();
  showToast("已加入购物车：" + p.name);
}

function changeQty(id, d) {
  const p = productCache[id];
  const next = (cart[id] || 0) + d;
  if (next > 0 && p && next > p.stock) {
    showToast("库存只剩 " + p.stock + " 件了", true);
    return;
  }
  cart[id] = next;
  if (cart[id] <= 0) delete cart[id];
  saveCart();
}

function saveCart() {
  localStorage.setItem("petshop_cart", JSON.stringify(cart));
  renderCart();
}

function renderCart() {
  const list = document.getElementById("cartList");
  const ids = Object.keys(cart);
  let total = 0, count = 0;
  if (!ids.length) {
    list.innerHTML = `<div style="color:#8A7A68;text-align:center;padding:40px 0">购物车还是空的～</div>`;
  } else {
    list.innerHTML = ids.map(id => {
      const p = productCache[id];
      const q = cart[id];
      const name = p ? p.name : ("商品 #" + id + "（已下架）");
      const price = p ? Number(p.price) : 0;
      total += price * q; count += q;
      return `<div class="cart-item">
        <div><div class="nm">${escapeHtml(name)}</div><div class="pr">¥${price.toFixed(2)} × ${q}</div></div>
        <div class="qty">
          <button onclick="changeQty(${id},-1)">−</button>
          <button onclick="changeQty(${id},1)">＋</button>
        </div>
      </div>`;
    }).join("");
  }
  document.getElementById("total").textContent = "¥" + total.toFixed(2);
  document.getElementById("badge").textContent = count;
}

function toggleCart(show) {
  document.getElementById("drawer").classList.toggle("show", show);
  document.getElementById("mask").classList.toggle("show", show);
}

/* ---------------- 下单结算：真正调用后端 ---------------- */

async function checkout() {
  const ids = Object.keys(cart);
  if (!ids.length) { showToast("购物车是空的", true); return; }

  // 只传「商品 id + 数量」，金额由后端自己算 —— 永远不要让前端决定价格
  const items = ids.map(id => ({productId: Number(id), quantity: cart[id]}));

  try {
    const order = await api("/orders", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({items})
    });
    cart = {};
    saveCart();
    toggleCart(false);
    showToast("下单成功！订单号 " + order.orderNo + "，合计 ¥" + Number(order.totalAmount).toFixed(2));
    await loadProducts();   // 库存被扣了，刷新列表
  } catch (e) {
    // 库存不足等业务错误会走到这里，后端返回的中文提示直接展示给用户
    showToast("下单失败：" + e.message, true);
  }
}

/* ---------------- 小工具 ---------------- */

function showBanner(msg) {
  const box = document.getElementById("banner");
  if (!msg) { box.classList.remove("show"); return; }
  document.getElementById("bannerText").textContent = msg;
  box.classList.add("show");
}

let toastTimer;
function showToast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), isError ? 3200 : 1800);
}

// 商品名里如果有 < > & 之类的字符，直接塞进 innerHTML 会破坏页面结构（XSS）。
// 数据来自后端，也不能假设它一定是干净的。
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]
  ));
}

/* ---------------- 启动 ---------------- */
loadCategories();
loadProducts().then(renderCart);
</script>
</body>
</html>
